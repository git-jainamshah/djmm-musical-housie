<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <title>DJMM Musical Housie</title>
  <style>
    @font-face {
      font-family: "Noto Serif Gujarati";
      src: url("/fonts/NotoSerifGujarati-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Noto Serif Gujarati";
      src: url("/fonts/NotoSerifGujarati-Medium.ttf") format("truetype");
      font-weight: 500;
    }
    @font-face {
      font-family: "Noto Serif Gujarati";
      src: url("/fonts/NotoSerifGujarati-SemiBold.ttf") format("truetype");
      font-weight: 600;
    }
    @font-face {
      font-family: "Noto Serif Gujarati";
      src: url("/fonts/NotoSerifGujarati-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; width: 210mm; height: 297mm; }
    body {
      color: #151515;
      background: #fff;
      font-family: "Noto Serif Gujarati", serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 210mm;
      height: 297mm;
      padding: 7mm 10mm 6mm;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .masthead { text-align: center; flex: 0 0 auto; }
    .blessing { margin: 0 0 0.8mm; color: #68645f; font-size: 7.5pt; font-weight: 500; }
    .evening { margin: 0; color: #7b756e; font-size: 10pt; font-weight: 500; }
    h1 { margin: 0.5mm 0 0; font-size: 20pt; line-height: 1.15; font-weight: 700; }
    .game-title {
      margin: 0.8mm auto 0;
      display: inline-flex;
      align-items: center;
      gap: 3mm;
      font-size: 9.5pt;
      font-weight: 600;
    }
    .game-title::before, .game-title::after {
      content: "";
      width: 2mm;
      height: 2mm;
      background: #171717;
      transform: rotate(45deg);
    }
    .date { margin: 0.8mm 0 0; font-size: 8.5pt; font-weight: 500; color: #4d4945; }

    .ticket-section {
      position: relative;
      height: 52mm;
      margin-top: 3.5mm;
      border: 0.45mm solid #34312e;
      border-radius: 1mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ticket-label {
      position: absolute;
      top: 1.6mm;
      left: 3mm;
      font-size: 7.5pt;
      font-weight: 700;
    }
    .ticket-number {
      position: absolute;
      top: 1.6mm;
      right: 3mm;
      font-size: 7.5pt;
      font-weight: 500;
    }
    .ticket-guide {
      width: 110mm;
      height: 45mm;
      border: 0.35mm dashed #aaa49d;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b857e;
      font-size: 7.5pt;
      font-weight: 500;
    }
    .ticket-guide::before,
    .ticket-guide::after {
      content: "";
      position: absolute;
      width: 8mm;
      height: 8mm;
      border-color: #67615b;
      pointer-events: none;
    }
    .ticket-guide::before {
      margin-left: -102mm;
      margin-top: -37mm;
      border-left: 0.45mm solid;
      border-top: 0.45mm solid;
    }
    .ticket-guide::after {
      margin-left: 102mm;
      margin-top: 37mm;
      border-right: 0.45mm solid;
      border-bottom: 0.45mm solid;
    }
    .generated-ticket {
      width: 110mm;
      height: 45mm;
      border: 0.6mm solid #171717;
      background: #fff;
      display: grid;
      grid-template-rows: 6mm 1fr;
      box-shadow: 0 1mm 2mm rgba(0, 0, 0, 0.08);
    }
    .generated-ticket-head {
      padding: 0 2mm;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #171717;
      color: #fff;
      font-size: 7.5pt;
      font-weight: 700;
    }
    .generated-ticket-grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }
    .ticket-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 0.32mm solid #34312e;
      border-bottom: 0.32mm solid #34312e;
      font-size: 15pt;
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .ticket-cell:nth-child(9n) { border-right: 0; }
    .ticket-cell:nth-last-child(-n + 9) { border-bottom: 0; }
    .ticket-cell.is-empty { background: #eeece9; }

    .prizes { margin-top: 3mm; flex: 0 0 auto; }
    .prizes-title {
      margin: 0;
      height: 7mm;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      color: #fff;
      font-size: 10pt;
      font-weight: 700;
    }
    .prize-grid {
      height: 30mm;
      padding: 1.5mm 4mm;
      border: 0.35mm solid #3b3834;
      border-top: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 1.2mm;
      column-gap: 15mm;
      font-size: 10pt;
      line-height: 1.15;
      font-weight: 500;
    }
    .prize {
      display: grid;
      grid-template-columns: auto minmax(8mm, 1fr) auto;
      align-items: center;
      column-gap: 1mm;
    }
    .prize::before {
      content: "";
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      border-bottom: 0.3mm dotted #8d8882;
      transform: translateY(0.6mm);
    }
    .prize > span { grid-column: 1; grid-row: 1; }
    .prize b { grid-column: 3; grid-row: 1; font-weight: 700; }
    .name-line {
      margin-top: 2.5mm;
      height: 6.5mm;
      display: flex;
      align-items: flex-end;
      gap: 3mm;
      font-size: 8pt;
      font-weight: 600;
    }
    .name-rule { flex: 1; border-bottom: 0.3mm solid #8d8882; height: 4mm; }

    .song-section { margin-top: 2.5mm; flex: 0 0 auto; }
    .song-heading {
      height: 8mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.25mm solid #161616;
      color: #77716a;
      font-size: 10pt;
      font-weight: 500;
    }
    .song-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 126mm;
    }
    .song-column {
      min-width: 0;
      padding: 1mm 2.7mm 0;
    }
    .song-column + .song-column { border-left: 0.3mm solid #d8d4cf; }
    .song-row {
      display: grid;
      grid-template-columns: 15.8mm minmax(0, 1fr);
      align-items: center;
      gap: 0.8mm;
      height: 8.4mm;
      border-bottom: 0.25mm solid #dfdcd7;
      font-size: 10pt;
      line-height: 1;
      white-space: nowrap;
    }
    .song-number { font-weight: 700; font-variant-numeric: tabular-nums; }
    .song-name { min-width: 0; font-weight: 600; }
    .footer-note {
      margin-top: auto;
      padding-top: 1.5mm;
      text-align: center;
      color: #6c6761;
      font-size: 7.5pt;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <p class="blessing" id="blessing"></p>
      <p class="evening" id="evening"></p>
      <h1 id="org"></h1>
      <div class="game-title" id="game"></div>
      <p class="date" id="date"></p>
    </header>

    <section class="ticket-section">
      <span class="ticket-label" id="ticket-label">ટિકિટ અહીં ચોંટાડો</span>
      <span class="ticket-number" id="ticket-number">ટિકિટ નં. __________________</span>
      <div class="ticket-guide" id="ticket-guide" data-width-mm="110" data-height-mm="45">તમારી ટિકિટ અહીંયા ચોટાડો</div>
      <div class="generated-ticket" id="generated-ticket" aria-label="મ્યુઝિકલ હાઉઝી ટિકિટ" hidden>
        <div class="generated-ticket-head">
          <span>મ્યુઝિકલ હાઉઝી ટિકિટ</span>
          <span id="generated-ticket-number"></span>
        </div>
        <div class="generated-ticket-grid" id="generated-ticket-grid"></div>
      </div>
    </section>

    <section class="prizes">
      <h2 class="prizes-title">આકર્ષક ઇનામો</h2>
      <div class="prize-grid">
        <div class="prize"><span>પહેલાં ૫</span><b>(૨)</b></div>
        <div class="prize"><span>નીચેની લાઈન</span><b>(૨)</b></div>
        <div class="prize"><span>પહેલાં ૯</span><b>(૨)</b></div>
        <div class="prize"><span>બ્રેકફાસ્ટ</span><b>(૨)</b></div>
        <div class="prize"><span>ચાર ખૂણા</span><b>(૨)</b></div>
        <div class="prize"><span>લંચ</span><b>(૨)</b></div>
        <div class="prize"><span>ઉપરની લાઈન</span><b>(૨)</b></div>
        <div class="prize"><span>ડિનર</span><b>(૨)</b></div>
        <div class="prize"><span>વચ્ચેની લાઈન</span><b>(૨)</b></div>
        <div class="prize"><span>ફુલ હાઉઝી</span><b>(૪)</b></div>
      </div>
    </section>

    <div class="name-line"><span>નામ</span><span class="name-rule"></span></div>

    <section class="song-section">
      <div class="song-heading"><span>નંબર &amp; ગીત</span><span>૪૫ સંગીતમય ગીતો</span></div>
      <div class="song-grid" id="song-grid"></div>
    </section>
    <footer class="footer-note">શ્રી ડભોઇ જૈન મિત્ર મંડળ - વડોદરા</footer>
  </main>

  <script>
    const GU = ["૦", "૧", "૨", "૩", "૪", "૫", "૬", "૭", "૮", "૯"];
    const toGu = value => String(value).replace(/\d/g, digit => GU[Number(digit)]);

    const params = new URLSearchParams(window.location.search);
    if (params.has("ticket")) {
      const sampleTicket = [
        [null, 13, 23, null, 41, 57, null, 71, null],
        [3, null, 29, null, 43, null, 61, null, 87],
        [null, 15, null, 35, 47, null, 65, 75, null]
      ];
      const ticketNumber = Number(params.get("ticketNumber")) || 1;
      const ticketGrid = document.getElementById("generated-ticket-grid");

      sampleTicket.flat().forEach(value => {
        const cell = document.createElement("span");
        cell.className = `ticket-cell${value == null ? " is-empty" : ""}`;
        cell.textContent = value == null ? "" : toGu(value);
        ticketGrid.appendChild(cell);
      });

      document.getElementById("ticket-label").hidden = true;
      document.getElementById("ticket-number").hidden = true;
      document.getElementById("ticket-guide").hidden = true;
      document.getElementById("generated-ticket").hidden = false;
      document.getElementById("generated-ticket-number").textContent = `ટિકિટ નં. ${toGu(String(ticketNumber).padStart(4, "0"))}`;
      document.documentElement.dataset.ticketReady = "true";
    }

    fetch("/data/songs.json")
      .then(response => response.json())
      .then(data => {
        document.getElementById("blessing").textContent = data.event.blessingGu;
        document.getElementById("evening").textContent = data.event.eveningGu;
        document.getElementById("org").textContent = data.event.titleGu;
        document.getElementById("game").textContent = data.event.subtitleGu;
        document.getElementById("date").textContent = data.event.dateGu;

        const grid = document.getElementById("song-grid");
        for (let column = 0; column < 3; column += 1) {
          const columnEl = document.createElement("div");
          columnEl.className = "song-column";
          data.songs.slice(column * 15, column * 15 + 15).forEach(song => {
            const row = document.createElement("div");
            row.className = "song-row";
            row.innerHTML = `<span class="song-number">${toGu(song.id)}, ${toGu(song.id + 45)}</span><span class="song-name">${song.nameGu}</span>`;
            columnEl.appendChild(row);
          });
          grid.appendChild(columnEl);
        }

        document.fonts.ready.then(() => {
          const rows = [...document.querySelectorAll(".song-row")];
          const overflowCount = rows.filter(row => {
            const name = row.querySelector(".song-name");
            return name.scrollWidth > name.clientWidth;
          }).length;
          document.documentElement.dataset.tableFontSize = getComputedStyle(rows[0]).fontSize;
          document.documentElement.dataset.overflowCount = String(overflowCount);
          document.documentElement.dataset.ready = "true";
        });
      });
  </script>
</body>
</html>
